name: Sync from upstream

on:
  schedule:
    - cron: '0 5 * * *'  # Todos los días a las 5 AM UTC
  workflow_dispatch:     # También se puede ejecutar manualmente

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0  # Trae todo el historial

      - name: Set up Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/ingadhoc/argentina-sale.git
          git fetch upstream

      - name: Merge upstream into fork
        run: |
          git checkout "17.0"
          git merge upstream/"17.0" || true

      - name: Push changes
        uses: ad-m/github-push-action@v0.8.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: "17.0"
